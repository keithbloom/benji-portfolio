backend:
  name: github
  repo: keithbloom/benji-portfolio
  branch: main

# Only used when the site is served from localhost AND the decap-server
# proxy is running (started automatically by docker compose). Edits then
# go straight to the local working tree instead of GitHub.
local_backend: true

publish_mode: editorial_workflow

media_folder: "assets/img/portfolio"
public_folder: "img/portfolio"

collections:
  - name: "portfolio"
    label: "Portfolio"
    label_singular: "Portfolio Item"
    folder: "content/portfolio"
    create: true
    format: "toml-frontmatter"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Cover Image", name: "image", widget: "image" }
      - {
          label: "Show Only Image",
          name: "showonlyimage",
          widget: "boolean",
          default: false,
          hint: "Hover overlay style on the homepage grid — doesn't skip the detail page.",
        }
      - { label: "Draft", name: "draft", widget: "boolean", default: false }
      - {
          label: "Weight",
          name: "weight",
          widget: "number",
          value_type: "int",
          hint: "Controls homepage order — lower numbers sort first.",
        }
      - { label: "Description", name: "description", widget: "text" }
      - {
          label: "Year",
          name: "year",
          widget: "number",
          value_type: "int",
          required: false,
          hint: "Year the piece was made — shown on the homepage card and project page.",
        }
      - {
          label: "Role",
          name: "role",
          widget: "string",
          required: false,
          hint: "Benji's role on the piece, e.g. Writer, Director, Editor.",
        }
      - {
          label: "Client",
          name: "client",
          widget: "string",
          required: false,
          hint: "Who the work was for, e.g. a school brief or a production company.",
        }
      - {
          label: "Tools",
          name: "tools",
          widget: "list",
          required: false,
          hint: "Software used, e.g. Adobe Premiere Pro, Adobe Animate. One entry per tool.",
        }
      - {
          label: "Tags",
          name: "tags",
          widget: "list",
          required: false,
          hint: "Disciplines for the homepage filter, e.g. Writing, Directing, Editing, Acting. One entry per tag.",
        }
      - label: "Content Blocks"
        name: "blocks"
        widget: "list"
        required: false
        hint: "Each block is one image, YouTube video, Instagram post, or Google Slides embed, with its own commentary."
        types:
          - label: "Image"
            name: "image"
            widget: "object"
            summary: "Image: {{fields.image}}"
            fields:
              - { label: "Image", name: "image", widget: "image" }
              - {
                  label: "Link URL",
                  name: "imageLink",
                  widget: "string",
                  required: false,
                  hint: "Optional — wraps the image in a link to this URL.",
                }
              - &block-commentary
                label: "Commentary"
                name: "content"
                widget: "markdown"
                required: false
                buttons: ["bold", "italic", "link", "bulleted-list", "numbered-list"]
                editor_components: []
          - label: "YouTube Video"
            name: "youtube"
            widget: "object"
            summary: "YouTube: {{fields.youtube}}"
            fields:
              - {
                  label: "YouTube Video ID",
                  name: "youtube",
                  widget: "string",
                  hint: "The part after v= in the YouTube URL.",
                }
              - *block-commentary
          - label: "Instagram Post"
            name: "instagram"
            widget: "object"
            summary: "Instagram: {{fields.instagram}}"
            fields:
              - {
                  label: "Instagram Shortcode",
                  name: "instagram",
                  widget: "string",
                  hint: "The part after /p/ in the Instagram post URL.",
                }
              - *block-commentary
          - label: "Google Slides Embed"
            name: "sheets"
            widget: "object"
            summary: "Slides: {{fields.sheets}}"
            fields:
              - {
                  label: "Embed ID",
                  name: "sheets",
                  widget: "string",
                  hint: "The part after /d/e/ in the Google Slides embed URL.",
                }
              - *block-commentary

  - name: "pages"
    label: "Pages"
    files:
      - name: "home"
        label: "Homepage"
        file: "content/_index.md"
        format: "toml-frontmatter"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - {
              label: "Headline",
              name: "headline",
              widget: "string",
              required: false,
              hint: "The big heading at the top of the homepage.",
            }
          - {
              label: "Tagline",
              name: "tagline",
              widget: "string",
              required: false,
              hint: "One line under the headline, e.g. current focus or course.",
            }
          - label: "Hero"
            name: "hero"
            widget: "object"
            hint: "The large feature at the top of the homepage."
            fields:
              - {
                  label: "Enabled",
                  name: "enabled",
                  widget: "boolean",
                  default: false,
                  hint: "Turn the hero on or off without losing its settings.",
                }
              - {
                  label: "Heading",
                  name: "heading",
                  widget: "string",
                  required: false,
                  hint: "Small label above the hero, e.g. Showreel or Featured work.",
                }
              - {
                  label: "Showreel (YouTube ID)",
                  name: "youtube",
                  widget: "string",
                  required: false,
                  hint: "The part after v= in the showreel's YouTube URL. When set, the hero shows this video. Paste the ID here once the showreel is ready.",
                }
              - {
                  label: "Featured item",
                  name: "item",
                  widget: "relation",
                  collection: "portfolio",
                  search_fields: ["title"],
                  display_fields: ["title"],
                  value_field: "{{slug}}",
                  required: false,
                  hint: "Shown as a large feature card while there's no showreel video. Ignored once a YouTube ID is set.",
                }
          - {
              label: "Intro",
              name: "body",
              widget: "markdown",
              required: false,
              hint: "Optional short intro shown under the showreel.",
            }
      - name: "about"
        label: "About"
        file: "content/about/_index.md"
        format: "toml-frontmatter"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - {
              label: "Photo",
              name: "aboutImage",
              widget: "image",
              required: false,
              hint: "Headshot or portrait shown next to the bio.",
            }
          - {
              label: "Skills & software",
              name: "skills",
              widget: "list",
              required: false,
              hint: "One entry per skill or piece of software.",
            }
          - { label: "Bio", name: "body", widget: "markdown" }
      - name: "contact"
        label: "Contact"
        file: "content/contact/_index.md"
        format: "toml-frontmatter"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - {
              label: "Email",
              name: "email",
              widget: "string",
              required: false,
              hint: "Shown on the contact page and in the footer.",
            }
          - {
              label: "LinkedIn URL",
              name: "linkedin",
              widget: "string",
              required: false,
            }
          - {
              label: "CV (PDF)",
              name: "cv",
              widget: "file",
              required: false,
              media_folder: "/static/files",
              public_folder: "/files",
              hint: "Downloadable CV offered on the contact page and footer.",
            }
          - {
              label: "Intro",
              name: "body",
              widget: "markdown",
              required: false,
              hint: "Optional short text above the contact details.",
            }
