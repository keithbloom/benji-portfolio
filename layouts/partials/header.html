<header class="site-header">
  <div class="wrap site-header__inner">
    <a class="brand" href="{{ site.Home.RelPermalink }}">{{ site.Title }}</a>
    <input type="checkbox" id="nav-toggle" class="nav-toggle" aria-hidden="true" />
    <label for="nav-toggle" class="nav-toggle__label" aria-label="Toggle menu">
      <span></span><span></span><span></span>
    </label>
    <nav class="site-nav" aria-label="Main navigation">
      {{ $current := . }}
      {{ range site.Params.navlinks }}
        {{ $url := relURL .url }}
        <a
          href="{{ $url }}"
          {{ if or (eq $current.RelPermalink $url) (and .home $current.IsHome) }}aria-current="page"{{ end }}>
          {{- .name -}}
        </a>
      {{ end }}
    </nav>
  </div>
</header>
