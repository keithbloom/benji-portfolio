{{ with resources.Get .image }}
  {{ $img := . | fingerprint }}
  <figure class="block__figure">
    {{ if $.imageLink }}
      <a href="{{ $.imageLink }}" target="_blank" rel="noopener">
        <img
          src="{{ $img.RelPermalink }}"
          width="{{ $img.Width }}"
          height="{{ $img.Height }}"
          loading="lazy"
          alt="" />
      </a>
    {{ else }}
      <img
        src="{{ $img.RelPermalink }}"
        width="{{ $img.Width }}"
        height="{{ $img.Height }}"
        loading="lazy"
        alt="" />
    {{ end }}
  </figure>
{{ end }}
