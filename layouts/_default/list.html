{{ define "main" }}
  <article class="page wrap">
    <header class="page__head">
      <h1>{{ .Title }}</h1>
    </header>
    {{ with .Content }}<div class="prose">{{ . }}</div>{{ end }}
    <ul class="page__list">
      {{ range .Pages }}
        <li><a href="{{ .RelPermalink }}">{{ .Title }}</a></li>
      {{ end }}
    </ul>
  </article>
{{ end }}
