version: '3'

services:
  tailwind:
    image: node:23-alpine
    container_name: benji-portfolio-tailwind
    volumes:
      - .:/src
    working_dir: /src
    tty: true
    command: sh -c "npm install && npm run tailwind:watch"

  hugo:
    image: klakegg/hugo:ext-alpine
    container_name: benji-portfolio-website
    volumes:
      - .:/src
    ports:
      - "1313:1313"
    working_dir: /src
    environment:
      - HUGO_ENVIRONMENT=development
      - HUGO_BUILDDRAFTS=true
    command: server --bind 0.0.0.0 --themesDir themes --theme hugo-creative-portfolio-theme
    depends_on:
      - tailwind

  # Decap CMS local backend: lets /admin edit the local working tree
  # (no GitHub login) during development. See local_backend in
  # static/admin/config.yml.
  cms-proxy:
    image: node:23-alpine
    container_name: benji-portfolio-cms-proxy
    working_dir: /project
    volumes:
      - .:/project
    ports:
      - "8081:8081"
    environment:
      # fs mode edits files directly without git commits — hugo server
      # live-reloads the changes; you commit when you're happy.
      - MODE=fs
    command: npx -y decap-server